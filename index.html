<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超LIKE实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header h1 span { color: #2ECC71; }
        
        /* 状态栏和标签切换区 */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .status {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .status button:hover { background: #30363d; }
        .status button:disabled { opacity: 0.5; cursor: default; }

        /* 选项卡样式 */
        .tabs {
            display: flex;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 3px;
            width: 240px;
        }
        .tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tabs button.active {
            background: #30363d;
            color: #fff;
        }

        #chart {
            flex: 1;
            width: 100%;
            min-height: 300px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>超LIKE · <span>实时数据追踪</span></h1>
    </div>

    <div class="controls">
        <div class="tabs">
            <button id="tab-total" class="active" onclick="switchTab('total')">累计数量 (24h)</button>
            <button id="tab-delta" onclick="switchTab('delta')">单次增量 (12h)</button>
        </div>
        <div class="status">
            <span id="update-time">加载中...</span>
            <button id="refresh-btn" onclick="loadData()">刷新</button>
        </div>
    </div>

    <div id="chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

        // 按要求的颜色配置
        const COLORS = {
            "苏新皓": "#FF4D4F", // 红色
            "朱志鑫": "#FAAD14", // 黄色
            "陈奕恒": "#9254DE", // 紫色
            "王橹杰": "#1677FF"  // 蓝色
        };
        const NAMES = ["苏新皓", "朱志鑫", "陈奕恒", "王橹杰"];
        
        let currentTab = 'total'; // 'total' | 'delta'
        let globalData = null;

        // 格式化数字
        function formatNum(v) {
            if (v === null || v === undefined) return '-';
            if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(1) + '万';
            return v.toLocaleString();
        }

        // 解析时间字符串 "2024-05-01 12:00:00"
        function parseTime(t) {
            const ms = new Date(String(t).replace(' ', 'T')).getTime();
            return isNaN(ms) ? null : ms;
        }

        // 切换选项卡
        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
            
            document.getElementById('tab-total').classList.toggle('active', tab === 'total');
            document.getElementById('tab-delta').classList.toggle('active', tab === 'delta');
            
            if (globalData) renderChart();
        }

        // 渲染图表
        function renderChart() {
            if (!globalData || !globalData.times.length) return;
            
            const data = globalData;
            const rawTimes = data.times;
            const seriesData = data.series;
            
            // 解析所有时间并找到最新时间点
            const parsedTimes = rawTimes.map(parseTime);
            const validTimes = parsedTimes.filter(t => t !== null);
            if (!validTimes.length) return;
            
            const lastTs = validTimes[validTimes.length - 1];
            
            // 根据模式决定窗口大小和时间显示
            let startTs, titleText, isDelta;
            if (currentTab === 'total') {
                startTs = lastTs - 24 * 60 * 60 * 1000; // 24小时
                titleText = "近24小时累计数量";
                isDelta = false;
            } else {
                startTs = lastTs - 12 * 60 * 60 * 1000; // 12小时
                titleText = "近12小时单次增量";
                isDelta = true;
            }

            const series = NAMES.map(name => {
                const values = seriesData[name] || [];
                const pts = [];
                let prevVal = null; // 用于计算增量

                for (let i = 0; i < parsedTimes.length; i++) {
                    const ts = parsedTimes[i];
                    if (ts === null || ts < startTs) continue; // 过滤掉窗口外的数据
                    
                    const val = values[i];
                    const num = (val === null || val === undefined) ? null : Number(val);

                    if (isDelta) {
                        // 增量计算：当前值 - 上一次的有效值
                        if (num !== null && prevVal !== null) {
                            pts.push([ts, num - prevVal]);
                        } else {
                            pts.push([ts, null]); // 中间断档或首个点不显示增量
                        }
                        if (num !== null) prevVal = num;
                    } else {
                        // 累计数量直接显示
                        pts.push([ts, num]);
                        if (num !== null) prevVal = num; // 累计模式下也记录prevVal以防切换
                    }
                }

                return {
                    name: name,
                    type: 'line',
                    smooth: true,
                    symbol: 'none', // 不显示圆点
                    connectNulls: false,
                    lineStyle: { width: 2.5, color: COLORS[name] },
                    itemStyle: { color: COLORS[name] },
                    areaStyle: isDelta ? { color: COLORS[name], opacity: 0.08 } : undefined,
                    data: pts
                };
            });

            const option = {
                title: {
                    text: titleText,
                    textStyle: { color: '#8b949e', fontSize: 12 },
                    top: 0, left: 0
                },
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    axisPointer: { type: 'line', lineStyle: { color: '#30363d' } },
                    formatter: function (params) {
                        if (!params || !params.length) return '';
                        // 格式化提示框时间
                        const date = new Date(params[0].value[0]);
                        const timeStr = `${date.getMonth()+1}-${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        
                        let html = `<div style="font-size:12px;color:#8b949e">${timeStr}</div>`;
                        params.forEach(p => {
                            const v = p.value[1];
                            const prefix = isDelta && v > 0 ? '+' : '';
                            html += `<div style="margin-top:4px">
                                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:6px;"></span>
                                ${p.seriesName}: <b>${prefix}${formatNum(v)}</b>
                            </div>`;
                        });
                        return html;
                    }
                },
                legend: {
                    data: NAMES,
                    textStyle: { color: '#c9d1d9', fontSize: 12 },
                    top: 25, icon: 'circle'
                },
                grid: {
                    left: '10%', right: '5%', bottom: '15%', top: 65, containLabel: true
                },
                xAxis: {
                    type: 'time',
                    min: startTs,
                    max: lastTs,
                    axisLabel: {
                        color: '#8b949e', fontSize: 10, hideOverlap: true,
                        formatter: function (value) {
                            const d = new Date(value);
                            return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        }
                    },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: { color: '#8b949e', fontSize: 10, formatter: formatNum },
                    splitLine: { lineStyle: { color: '#30363d', type: 'dashed' } }
                },
                series: series,
                animationDuration: 400
            };

            myChart.setOption(option, true);
        }

        // 加载 JSON 数据
        function loadData() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.innerText = "加载中";
            
            // 添加时间戳防止浏览器缓存
            fetch('cloud_data.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    globalData = data;
                    if (data.times && data.times.length > 0) {
                        document.getElementById('update-time').innerText = '最后更新：' + data.times[data.times.length - 1];
                    }
                    renderChart();
                })
                .catch(err => {
                    console.error('加载失败', err);
                    document.getElementById('update-time').innerText = '数据加载失败，请稍后重试';
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = "刷新";
                });
        }

        // 页面初始化
        loadData();
        // 自动每 15 分钟刷新一次前端数据
        setInterval(loadData, 15 * 60 * 1000);

        // 窗口尺寸变化时自适应
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
