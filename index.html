<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超LIKE实时监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .header { text-align: center; padding: 12px 0 8px; flex-shrink: 0; }
        .header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
        .header h1 span { color: #2ECC71; }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .status {
            font-size: 12px;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .status button:hover { background: #30363d; }
        .status button:disabled { opacity: 0.5; cursor: default; }

        .tabs {
            display: flex;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 3px;
            width: 260px;
        }
        .tabs button {
            flex: 1;
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tabs button.active { background: #30363d; color: #fff; }

        #chart { flex: 1; width: 100%; min-height: 300px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>超LIKE · <span>实时数据追踪</span></h1>
    </div>

    <div class="controls">
        <div class="tabs">
            <button id="tab-total" class="active" onclick="switchTab('total')">累计数量 (24h)</button>
            <button id="tab-delta" onclick="switchTab('delta')">单次增量 (12h)</button>
        </div>
        <div class="status">
            <span id="update-time">加载中...</span>
            <button id="refresh-btn" onclick="loadData()">刷新</button>
        </div>
    </div>

    <div id="chart"></div>

    <script>
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });

        const COLORS = {
            "苏新皓": "#FF4D4F", // 红色
            "朱志鑫": "#FAAD14", // 黄色
            "陈奕恒": "#9254DE", // 紫色
            "王橹杰": "#1677FF"  // 蓝色
        };
        const NAMES = ["苏新皓", "朱志鑫", "陈奕恒", "王橹杰"];
        
        let currentTab = 'total';
        let globalData = null;

        // ★ 修改了这里的格式化函数：移除“万”的缩写，直接显示完整数字（带千分位）
        function formatNum(v) {
            if (v === null || v === undefined) return '-';
            return v.toLocaleString(); 
        }

        function parseTime(t) {
            if (!t) return null;
            const ms = new Date(String(t).replace(' ', 'T')).getTime();
            return isNaN(ms) ? null : ms;
        }

        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
            document.getElementById('tab-total').classList.toggle('active', tab === 'total');
            document.getElementById('tab-delta').classList.toggle('active', tab === 'delta');
            if (globalData) renderChart();
        }

        function renderChart() {
            if (!globalData || !globalData.times || globalData.times.length === 0) {
                myChart.clear();
                myChart.setOption({
                    title: { text: '暂无数据，请等待自动抓取或检查 JSON 文件', left: 'center', top: 'center', textStyle: { color: '#8b949e', fontSize: 14 } }
                });
                return;
            }
            
            const data = globalData;
            const rawTimes = data.times;
            const seriesData = data.series;
            
            const parsedTimes = rawTimes.map(parseTime);
            const validTimes = parsedTimes.filter(t => t !== null);
            if (!validTimes.length) return;
            
            const lastTs = validTimes[validTimes.length - 1];
            
            let startTs, titleText, isDelta;
            if (currentTab === 'total') {
                startTs = lastTs - 24 * 60 * 60 * 1000;
                titleText = "近24小时累计数量";
                isDelta = false;
            } else {
                startTs = lastTs - 12 * 60 * 60 * 1000;
                titleText = "近12小时单次增量";
                isDelta = true;
            }

            const series = NAMES.map(name => {
                const values = seriesData[name] || [];
                const pts = [];
                let prevVal = null;

                for (let i = 0; i < parsedTimes.length; i++) {
                    const ts = parsedTimes[i];
                    if (ts === null) continue; 
                    if (ts < startTs && pts.length > 0) continue; 
                    
                    const val = values[i];
                    const num = (val === null || val === undefined) ? null : Number(val);

                    if (isDelta) {
                        if (num !== null && prevVal !== null) {
                            pts.push([ts, num - prevVal]);
                        } else {
                            pts.push([ts, null]);
                        }
                        if (num !== null) prevVal = num;
                    } else {
                        pts.push([ts, num]);
                        if (num !== null) prevVal = num;
                    }
                }

                return {
                    name: name,
                    type: 'line',
                    smooth: true,
                    symbol: 'circle', 
                    symbolSize: 5,
                    connectNulls: false,
                    lineStyle: { width: 2.5, color: COLORS[name] },
                    itemStyle: { color: COLORS[name] },
                    areaStyle: isDelta ? { color: COLORS[name], opacity: 0.08 } : undefined,
                    data: pts
                };
            });

            const option = {
                title: { text: titleText, textStyle: { color: '#8b949e', fontSize: 12 }, top: 0, left: 0 },
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#161b22',
                    borderColor: '#30363d',
                    textStyle: { color: '#c9d1d9' },
                    axisPointer: { type: 'line', lineStyle: { color: '#30363d' } },
                    formatter: function (params) {
                        if (!params || !params.length) return '';
                        const date = new Date(params[0].value[0]);
                        const timeStr = `${date.getMonth()+1}-${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        let html = `<div style="font-size:12px;color:#8b949e">${timeStr}</div>`;
                        params.forEach(p => {
                            const v = p.value[1];
                            const prefix = isDelta && v > 0 ? '+' : '';
                            html += `<div style="margin-top:4px">
                                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:6px;"></span>
                                ${p.seriesName}: <b>${prefix}${formatNum(v)}</b>
                            </div>`;
                        });
                        return html;
                    }
                },
                legend: { data: NAMES, textStyle: { color: '#c9d1d9', fontSize: 12 }, top: 25, icon: 'circle' },
                grid: { left: '10%', right: '5%', bottom: '15%', top: 65, containLabel: true },
                xAxis: {
                    type: 'time',
                    min: startTs,
                    max: lastTs,
                    axisLabel: {
                        color: '#8b949e', fontSize: 10, hideOverlap: true,
                        formatter: function (value) {
                            const d = new Date(value);
                            return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        }
                    },
                    axisLine: { lineStyle: { color: '#30363d' } },
                    splitLine: { show: false }
                },
                yAxis: {
                    type: 'value',
                    scale: true, // ★ 让 Y 轴不从 0 开始，而是根据数据自适应，这样折线变化看起来更明显
                    axisLabel: { color: '#8b949e', fontSize: 10, formatter: formatNum },
                    splitLine: { lineStyle: { color: '#30363d', type: 'dashed' } }
                },
                series: series,
                animationDuration: 400
            };

            myChart.setOption(option, true);
        }

        function loadData() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.innerText = "加载中";
            
            fetch('cloud_data.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    globalData = data;
                    if (data.times && data.times.length > 0) {
                        document.getElementById('update-time').innerText = '最后更新：' + data.times[data.times.length - 1];
                    } else {
                        document.getElementById('update-time').innerText = 'JSON 内无数据';
                    }
                    renderChart();
                })
                .catch(err => {
                    console.error('加载失败', err);
                    document.getElementById('update-time').innerText = '未找到 cloud_data.json';
                    myChart.clear();
                    myChart.setOption({ title: { text: '找不到数据文件，请确认 GitHub Actions 已成功运行并生成 JSON', left: 'center', top: 'center', textStyle: { color: '#FF4D4F', fontSize: 12 } } });
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = "刷新";
                });
        }

        loadData();
        setInterval(loadData, 15 * 60 * 1000);
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
