name: Auto Monitor Weibo Data

on:
  schedule:
    # 每 15 分钟运行一次 (GitHub 会有几分钟延迟)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许你手动点击按钮触发运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许向仓库写入文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor script
        run: python weibo_monitor.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud_data.json
          # 只有当文件发生改变时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data" && git push)
